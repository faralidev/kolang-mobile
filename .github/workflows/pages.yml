# Deploy the kolang-mobile WebView editor to GitHub Pages
# https://faralidev.github.io/kolang-mobile/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # @kolang/grammar is a file:../kolang-grammar dep (sibling repo, matches
      # kolang-ide). Check it out into a subdir and link it one level up so the
      # file: path resolves during npm install.
      - name: Checkout kolang-grammar (sibling)
        uses: actions/checkout@v5
        with:
          repository: faralidev/kolang-grammar
          path: kolang-grammar

      - name: "Place sibling repo where file: dep expects it"
        shell: bash
        run: ln -s "$GITHUB_WORKSPACE/kolang-grammar" "$GITHUB_WORKSPACE/../kolang-grammar"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build webview bundle
        run: node scripts/build-webview.cjs

      - name: Build Pages HTML
        run: node scripts/build-pages.cjs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
